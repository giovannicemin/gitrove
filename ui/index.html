<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitrove</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/graph.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>gitrove</b><span>v0.2</span></div>
    <div class="title"><strong id="pname">—</strong><em id="psub"></em></div>
    <div class="file" id="file">
      <span class="dot-dirty"></span><span class="fname" id="fname">—</span>
      <button id="open" title="Open a project (Ctrl-O)">open</button>
      <button id="save" title="Save (Ctrl-S)" disabled>save</button>
    </div>
    <div class="stats" id="stats"></div>
  </header>
  <main>
    <aside><div class="side-h">Branches</div><div id="blist"></div></aside>
    <div class="canvas-wrap">
      <svg id="svg"><g id="vp"></g></svg>
      <div id="settings" class="open">
        <div class="head" id="shead">&#9881; settings <span class="caret">&#9656;</span></div>
        <div class="body">
          <label class="chk"><input type="checkbox" id="alllabels" checked> label every node</label>
          <div class="grp"><span>time spacing</span>
            <div class="seg" id="timemode">
              <button data-v="date" class="on">by date</button><button data-v="even">even</button></div></div>
          <div class="grp"><span>branches</span>
            <div class="seg" id="branchside">
              <button data-v="below" class="on">below</button><button data-v="above">above</button><button data-v="both">both sides</button></div></div>
          <div class="grp"><span>label placement</span>
            <div class="seg" id="labelmode">
              <button data-v="auto" class="on">auto</button><button data-v="above">above</button><button data-v="below">below</button></div></div>
        </div>
      </div>
      <div class="hint">drag to pan · scroll to zoom · click a node</div>
      <div class="controls">
        <button id="zout">−</button><button id="zin">+</button>
        <button id="home">today</button><button id="fit">fit</button>
        <span class="sep"></span>
        <button id="theme" class="switch" role="switch" title="Light / dark">
          <span class="knob">
            <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
              <circle cx="12" cy="12" r="4.4"/>
              <path d="M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/>
            </svg>
            <svg class="ico moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round">
              <path d="M20.5 14.8A8.8 8.8 0 019.2 3.5a8.8 8.8 0 1011.3 11.3z"/>
            </svg>
          </span>
        </button>
      </div>
      <div id="detail"><button class="close" id="dclose">×</button><div id="dbody"></div></div>
      <div id="tip"></div>
    </div>
  </main>
</div>
<div id="err" hidden></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
