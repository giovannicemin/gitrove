[package]
name = "gitrove"
version = "0.3.0"
description = "A git-style commit graph for work that isn't code"
edition = "2021"

[lib]
name = "gitrove_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
